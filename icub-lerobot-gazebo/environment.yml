name: icub_lerobot_gazebo_env
channels:
  - conda-forge
  - https://repo.prefix.dev/robotology
  - pytorch
dependencies:
  # --- Dependencias de Sistema (Conda) ---
  - python=3.10
  - ffmpeg               # Lerobot suele necesitarlo para grabar videos
  - pytorch              # Mejor instalarlo por conda para compatibilidad con CUDA
  - torchvision
  - yarp                 # Requerido por lerobot-robot-icubrg y common/yarp_module/
  - icub-main
  - icub-models
  - mujoco               # Motor de física usado solo por el visualizador/IK del teleoperador
  - pyquaternion
  - numpy
  - pyyaml
  - idyntree
  - opencv
  # --- Dependencias de Python (Pip) ---
  - pip
  - pip:
    - lerobot
    - -e ./common/lerobot-robot-icubrg              # cliente YARP (robot real/Gazebo)
    - -e ./common/lerobot-teleoperator-icubrgteleop
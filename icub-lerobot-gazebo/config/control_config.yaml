# ─────────────────────────────────────────────────────────────────────────────
# ÚNICO switch simulación / robot real.
# "icubSim" = Gazebo  |  "icub" = robot real.
# De aquí se derivan TODOS los puertos YARP (/{robot_name}/...): cámaras,
# encoders, controlador cartesiano, skin. No hardcodear /icub en otro sitio.
# ─────────────────────────────────────────────────────────────────────────────
robot_name: "icub"
period: 0.02
show_cameras: true

# Configuración de Control: 'left', 'right', 'both' o 'none'
control_arms: "right"
primary_arm: "right_arm"
gaze_ctrl: true
cart_ctrl: true
# true = antes de cada movimiento cartesiano el módulo hace stop() y fuerza
# POSITION_DIRECT en el brazo. false = deja que el
# cartesianController del robot elija su modo (lo estándar en iCub).
cart_force_position_direct: false
# Carrier de los puertos de streaming del controlador cartesiano (command/state/events).
# goToPose no espera respuesta: con "udp" (default de iCub) los comandos se pierden en
# la red del robot real y el brazo no se mueve. "tcp" sirve igual en Gazebo.
cart_carrier: "tcp"
# Límites del torso [deg] que usa el cartesiano del brazo principal (pitch adelante +).
# Mismos límites en el robot real, Gazebo y MuJoCo (icub-lerobot-mj usa cart_torso_limits
# para su IK): una política no debe pedir posturas que el robot real no permite.
cart_torso_limits:        {pitch: [-15, 15], yaw: [-10, 10]}
# Gazebo: mirar solo con el cuello, ojos fijos al frente y sin roll de cuello, como el IK de
# mirada de MuJoCo (su head_cam va fija a la cabeza y neck_roll es siempre 0). Para evaluar
# políticas de MuJoCo; con false los ojos ayudan a mirar.
# OJO: con los ojos bloqueados, iKinGazeCtrl deja la cabeza fija (-56 deg pitch, sin yaw) en Gazebo.
gazebo_gaze_head_only: false
# neck_roll en 0 (los ojos siguen libres), como el IK de mirada de MuJoCo, que lo fija
# siempre: sin bloquearlo, iKinGazeCtrl lo mueve entre -0.07 y 0.25 rad sin que se le pida,
# mientras que en MuJoCo vale siempre 0. Gazebo y robot real.
gaze_block_neck_roll: true
strict_xml_init: true

# Tacto (skin) — republicado por teleop_module_sm.py en /teleop/touch:o
# Los puertos se derivan de robot_name; descomenta solo para forzar otro origen.
tactile_enabled: true
tactile_include_palm: true
tactile_auto_connect: true
# tactile_source_port: "/icubSim/skin/right_hand_comp"
# tactile_palm_source_port: "/icubSim/skin/right_hand"

# Observaciones extra del dataset (plugin lerobot_robot_icubrg), con los mismos nombres
# que graba MuJoCo para poder cruzar políticas entre simuladores (sim-to-sim). Todas van en
# el frame root del iCub, igual que MuJoCo.
use_joint_vel: true      # {joint}_vel        (teleop_module_sm las publica en robot_state)
use_joint_torque: true   # {joint}_torque     (también activa su lectura en teleop_module_sm)
use_eef_pose: true       # rh_ee_pos_*/rh_ee_quat_*   (cartesianController)
use_targets: true        # rh_target_*, gaze_target_pos_*, rh_gripper (último comando)
use_tactile: true        # {rh,lh}_touch_{thumb,index,middle} (0/1). Gazebo: sensores de contacto de las
                         # puntas (model.urdf, ambas manos); robot real: piel vía /teleop/touch:o (derecha)
use_object_pose: true    # obj{i}_pos_*/obj{i}_quat_* (ground truth de Gazebo; con robot_name icub se ignora)
# object_bodies: ["blue-cube"]   # por defecto: objetos de la escena activa en scenes.yaml
# root_link del iCub en el mundo Gazebo (<pose> del iCub en gazebo/worlds/icub_world.sdf),
# la misma altura que la cintura en MuJoCo.
gazebo_root_xyz: [0.0, 0.0, 0.73]
# Todas las cámaras a 320x240, igual que MuJoCo (la frontal de Gazebo publica 640x480 y el
# plugin la redimensiona).
camera_shapes: {front: [240, 320], top: [240, 320]}

# Definición de articulaciones por parte
actuators:
  head:
    - "neck_pitch"
    - "neck_roll"
    - "neck_yaw"
    - "eyes_tilt"
    - "eyes_version"
    - "eyes_vergence"
  torso:
    - "torso_pitch"
    - "torso_roll"
    - "torso_yaw"
  left_arm:
    - "l_shoulder_pitch"
    - "l_shoulder_roll"
    - "l_shoulder_yaw"
    - "l_elbow"
    - "l_wrist_prosup"
    - "l_wrist_pitch"
    - "l_wrist_yaw"
    - "l_hand_finger"
    - "l_thumb_oppose"
    - "l_thumb_proximal"
    - "l_thumb_distal"
    - "l_index_proximal"
    - "l_index_distal"
    - "l_middle_proximal"
    - "l_middle_distal"
    - "l_pinky"
  right_arm:
    - "r_shoulder_pitch"
    - "r_shoulder_roll"
    - "r_shoulder_yaw"
    - "r_elbow"
    - "r_wrist_prosup"
    - "r_wrist_pitch"
    - "r_wrist_yaw"
    - "r_hand_finger"
    - "r_thumb_oppose"
    - "r_thumb_proximal"
    - "r_thumb_distal"
    - "r_index_proximal"
    - "r_index_distal"
    - "r_middle_proximal"
    - "r_middle_distal"
    - "r_pinky"

# Pose de trabajo: brazos extendidos hacia adelante sobre la mesa
home_pose:
  torso_pitch: 10.0
  torso_roll: 0.0
  torso_yaw: 0.0
  l_shoulder_pitch: -60.0
  l_shoulder_roll: 20.0
  l_shoulder_yaw: 0.0
  l_elbow: 70.0
  l_wrist_prosup: 0.0
  l_wrist_pitch: -10.0
  l_wrist_yaw: 0.0
  r_shoulder_pitch: -60.0
  r_shoulder_roll: 20.0
  r_shoulder_yaw: 0.0
  r_elbow: 70.0
  r_wrist_prosup: 0.0
  r_wrist_pitch: -10.0
  r_wrist_yaw: 0.0
  neck_pitch: 15.0
  neck_roll: 0.0
  neck_yaw: 0.0
  eyes_tilt: 0.0
  eyes_version: 0.0
  eyes_vergence: 0.0

hand_open_values:
  - [0, 75, 0, 0, 0, 0, 0, 0, 0]
hand_close_values:
  - [0, 40, 40, 50, 75, 75, 75, 75, 0]
# Fracción del cierre que se aplica realmente (1.0 = hand_close_values completo).
# Con 0.7 quedan ~3 cm entre las puntas de índice y pulgar (no se atraviesan);
# súbelo o bájalo para ajustar el espacio.
hand_close_ratio: 0.5
# Pinza = fracción de cierre 0..1 (rh/lh_gripper). Gatillo inferior del VR: bajo el primer
# valor = abierta, sobre el segundo = cerrada, proporcional entre medio. Mismo valor en
# icub-lerobot-mj y icub-lerobot-gazebo.
vr_grip_deadband: [0.1, 0.9]

# Área donde el visualizador MuJoCo hace aparecer el cubo (marco MuJoCo). Solo se usa si
# su escena tiene blue-cube y scenes.yaml no declara objetos: el espejo de play_gazebo es la
# mesa vacía y el cubo vive en Gazebo.
cube_spawn:
  x: [0.35, 0.45]
  y: [-0.15, -0.05]
  z: 0.725

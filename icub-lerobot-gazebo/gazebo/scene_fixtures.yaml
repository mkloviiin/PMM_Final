# Piezas fijas de cada escena en Gazebo (las que en MuJoCo estan en el XML pero no en scenes.yaml).
# Las lee gazebo/scripts/reset_objects.sh. Etiqueta de scenes.yaml -> lista de modelos con su pose
# en el marco de GAZEBO (el iCub mira hacia -x): (x, y) = (-x, -y) del XML de MuJoCo.
"Pick-and-Place":
  - model: place-bin
    pose: [-0.4, -0.12, 0.72]      # MuJoCo: place-bin en (0.4, 0.12, 0.72)
"Two-Arm Peg-In-Hole":
  - model: hole-board
    pose: [-0.39, -0.15, 0.73]     # MuJoCo: hole-board en (0.39, 0.15, 0.73)
  - model: peg-cradle
    pose: [-0.4, 0.12, 0.735]      # MuJoCo: rieles en (0.4, -0.145 y -0.095, 0.735); centro del slot en y=-0.12

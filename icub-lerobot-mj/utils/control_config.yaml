hand_open_values:
  - [0, 75, 0, 0, 0, 0, 0, 0, 0]
hand_close_values:
  - [60, 40, 10, 70, 50, 120, 60, 100, 160]

cube_spawn:
  x: [0.35, 0.45]
  y: [-0.15, -0.05]
  z: 0.627

robot_name: "icubSim"
period: 0.02
show_cameras: true

# Calidad JPEG del streaming a los lentes VR (0-100, mas alto = mejor calidad / mas ancho de banda)
stream_jpeg_quality: 70

# Configuración de Control: 'left', 'right', 'both' o 'none'
control_arms: "both" 
primary_arm: "right_arm"
gaze_ctrl: true
# Marco de las poses grabadas (manos, targets, mirada, objetos) y de las acciones:
# "root" = frame root del iCub, igual que Gazebo y el robot real (sim-to-sim directo).
# "world" = mundo MuJoCo, solo para datasets/modelos --legacy.
pose_frame: "root"
# Límites del torso [deg] del IK de brazos: los del robot real (cart_torso_limits de
# icub-lerobot-gazebo/config/control_config.yaml); el roll queda fijo en 0.
cart_torso_limits: {pitch: [-15, 15], yaw: [-10, 10]}
strict_xml_init: true

# Definición de articulaciones por parte
actuators:
  head:
    - "neck_pitch"
    - "neck_roll"
    - "neck_yaw"
  torso: 
    - "torso_pitch"
    - "torso_roll"
    - "torso_yaw"
  left_arm: 
    - "l_shoulder_pitch"
    - "l_shoulder_roll"
    - "l_shoulder_yaw"
    - "l_elbow"
    - "l_wrist_prosup"
    - "l_wrist_pitch"
    - "l_wrist_yaw"
    - "l_hand_finger"
    - "l_thumb_oppose"
    - "l_thumb_proximal"
    - "l_thumb_distal"
    - "l_index_proximal"
    - "l_index_distal"
    - "l_middle_proximal"
    - "l_middle_distal"
    - "l_pinky"
  right_arm: 
    - "r_shoulder_pitch"
    - "r_shoulder_roll"
    - "r_shoulder_yaw"
    - "r_elbow"
    - "r_wrist_prosup"
    - "r_wrist_pitch"
    - "r_wrist_yaw"
    - "r_hand_finger"
    - "r_thumb_oppose"
    - "r_thumb_proximal"
    - "r_thumb_distal"
    - "r_index_proximal"
    - "r_index_distal"
    - "r_middle_proximal"
    - "r_middle_distal"
    - "r_pinky"

# Pose de trabajo: brazos extendidos hacia adelante sobre la mesa
home_pose:
  torso_pitch: 10.0
  torso_roll: 0.0
  torso_yaw: 0.0
  l_shoulder_pitch: -60.0
  l_shoulder_roll: 20.0
  l_shoulder_yaw: 0.0
  l_elbow: 70.0
  l_wrist_prosup: 0.0
  l_wrist_pitch: -10.0
  l_wrist_yaw: 0.0
  r_shoulder_pitch: -60.0
  r_shoulder_roll: 20.0
  r_shoulder_yaw: 0.0
  r_elbow: 70.0
  r_wrist_prosup: 0.0
  r_wrist_pitch: -10.0
  r_wrist_yaw: 0.0
  neck_pitch: 15.0
  neck_roll: 0.0
  neck_yaw: 0.0
  eyes_tilt: 0.0
  eyes_version: 0.0
  eyes_vergence: 0.0



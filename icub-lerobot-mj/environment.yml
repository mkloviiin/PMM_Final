name: icub_lerobot_env
channels:
  - conda-forge
  - https://repo.prefix.dev/robotology 
  - pytorch
dependencies:
  # --- Dependencias de Sistema (Conda) ---
  - python=3.10
  - ffmpeg               # LeRobot lo usa para codificar los videos
  - pytorch              # por conda, para compatibilidad con CUDA
  - torchvision
  - yarp
  - icub-main
  - icub-models
  - mujoco
  - pyquaternion
  - numpy
  - pyyaml
  - idyntree
  - opencv
  # --- Dependencias de Python (Pip) ---
  - pip
  - pip:
    - lerobot
    - -e ./lerobot-robot-icub
    - -e ./lerobot-teleoperator-icubteleop
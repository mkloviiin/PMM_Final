# Scene manifest of the iCub tasks: the only one, shared by MuJoCo and Gazebo / real robot.
#
# Read by: the Hub (task dropdown of both robots), play.py / eval_policy.py (objects, joints,
# cameras, task), gazebo_sim/scripts/reset_objects.sh (spawns the objects in Gazebo, converting
# the MuJoCo frame to Gazebo's: (x, y) -> (-x, -y)) and lerobot_robot_icubrg (obj{i} bodies).
# Fixed pieces of a scene in Gazebo (the door) are in gazebo_sim/scene_fixtures.yaml.
#
# This folder also contains XMLs that are NOT selectable scenes (shared
# includes like icub_visuomanip_ikin_limits.xml or icub_room_arena.xml),
# so scenes are declared here instead of auto-detecting all *.xml files.
#
# To add a new scene: drop the XML in this folder and add an entry here.
# launcher_gui will warn (in the log) if it finds a loose *.xml in the
# folder that is not listed here, to avoid "orphan" scenes.
#
# - file: name of the XML inside this same folder
# - label: text shown in the "Scene" dropdown
# - task: default language instruction for that scene

# ── Enabled scenes ────────────────────────────────────────────────────────────
#
# Optional `objects` list: declares resettable bodies and their spawn ranges.
# On reset (N in the MuJoCo viewer), each object is randomised within its range.
# Optional `joints` list: hinge/slide joints set to `qpos` on reset (e.g. the door).
# If both are absent, reset does nothing (correct for fixed scenes).
#
# Optional `cameras` list: cameras recorded for that task (default: left, right, front =
# eyes + external front camera). Names as in lerobot_robot_icub camera_sources (MuJoCo) and
# lerobot_robot_icubrg (Gazebo/real); "top" is the overhead camera.
#
# Spawn rules:
#   x/y/z:  [min, max] → uniform random  |  scalar → fixed  |  absent → unchanged
#   quat:   [w, x, y, z] reset orientation (default [1, 0, 0, 0]). [0, 0, 0, 1] (180 deg in z)
#           = identity in the iCub root frame, like Gazebo's objects (same recorded obj quat)
#   mirror_y: true → on each reset, one 50/50 draw shared by all objects with this flag: either
#           the y ranges as written, or all of them negated (layout mirrored to the other side)
#
# MuJoCo only for now (src/tools/scene_reset.py; Gazebo ignores these two keys):
#   sides: right | left | alternate → side of the task. The y ranges are the right-side ones
#           (object to pick on the robot's right, y < 0); "left" mirrors every object in y. Door:
#           side of the handle. alternate = right, left, right...: every reset switches side
#           (Y, N / Reset scene, saved or discarded episode, each eval episode). With `sides`,
#           MuJoCo ignores mirror_y's 50/50 draw.
#   door: {panel_xy: [x, y], jitter: m} → door panel center, + uniform ±jitter in x and y.

- file: scene_icub_lift.xml
  label: "Block Lifting"
  # Marco MuJoCo: x adelante, y a la izquierda del robot (reset_objects.sh lo convierte para Gazebo).
  task: "lift the blue block"
  sides: alternate               # cubo a la derecha (mano derecha) o a la izquierda (espejo en y)
  objects:
    - body: "blue-cube"
      spawn:
        x: [0.35, 0.45]
        y: [-0.15, -0.05]
        z: 0.745                 # apoyado sobre la mesa (tapa 0.72 + semialtura 0.025)
        # Girado 180 deg en z: en el frame root del robot queda con cuaternión identidad,
        # igual que el cubo de Gazebo (su mundo ya está girado 180 deg respecto de MuJoCo).
        quat: [0, 0, 0, 1]

- file: scene_icub_stack.xml
  label: "Block Stacking"
  task: "stack the blue cube on top of the red cube"
  sides: alternate               # MuJoCo: alterna en cada reset (Gazebo: mirror_y, 50/50)
  # Desde el 2026-10-28 los cubos quedan siempre en lados opuestos y la disposición se refleja al
  # azar (mirror_y): azul a la derecha / rojo a la izquierda, o al revés. El robot toma el azul con
  # el brazo de su lado y lo apila cruzando hacia el rojo. Hasta entonces, siempre sin reflejar.
  objects:
    - body: "blue-cube"
      spawn:
        x: [0.35, 0.45]          # mismo rango que Block Lifting (desde el 2026-10-27; antes
        y: [-0.15, -0.05]        # x [0.25, 0.40], y [-0.20, -0.05], el de stacking_mujoco_demo)
        z: 0.745                 # tapa 0.72 + semialtura 0.025 (como Z_GAZEBO de reset_objects.sh);
                                 # más bajo, los cubos quedan hundidos en la mesa
        quat: [0, 0, 0, 1]       # 180 deg en z = identidad en el frame root (como Gazebo)
        mirror_y: true
    - body: "red-cube"
      spawn:
        x: [0.3025, 0.40]
        y: [0.02, 0.09]          # el brazo derecho lo apila bien hasta y = 0.09; desde 0.12 pierde
                                 # orientación y desde 0.15 no llega (hasta el 2026-10-26: [0.05, 0.20])
        z: 0.745
        quat: [0, 0, 0, 1]       # 180 deg en z = identidad en el frame root (como Gazebo)
        mirror_y: true

- file: scene_icub_pickplace.xml
  label: "Pick-and-Place"
  task: "grasp the object and place it at the target position"
  sides: alternate               # cubo a la derecha y caja a la izquierda, o al revés (espejo en y)
  objects:
    - body: "pick-cube"
      spawn:
        x: [0.25, 0.40]
        y: [-0.20, -0.05]
        z: 0.725
        quat: [0, 0, 0, 1]       # 180 deg en z = identidad en el frame root (como Gazebo)
    - body: "place-bin"          # suelta (0.073 kg); se graba como obj1
      spawn:
        x: [0.36, 0.44]
        y: [0.09, 0.15]          # a la izquierda; con y < 0.09 la pared queda cerca del rango del cubo
        z: 0.7225                # tapa de la mesa 0.72 + media altura de la base 0.0025
        quat: [0, 0, 0, 1]

- file: scene_icub_door.xml
  label: "Door Opening"
  task: "open the door"
  # MuJoCo: puerta centrada frente al robot y la manilla alterna de lado (se abre con la mano de
  # ese lado). Gazebo: manilla a la izquierda, mano derecha. Se graba la cenital, no la frontal.
  cameras: [left, right, top]
  sides: alternate               # lado de la manilla
  door:
    panel_xy: [0.47, 0.0]        # centro de la hoja (el XML la tiene en (0.47, -0.13))
    jitter: 0.03                 # ± uniforme en x y en y
  joints:
    - name: "door_hinge"
      qpos: 0.0
    - name: "handle_hinge"
      qpos: 0.0

- file: scene_icub_peginhole.xml
  label: "Two-Arm Peg-In-Hole"   # tabla con la derecha, clavija con la izquierda
  task: "insert the peg into the hole"
  objects:
    - body: "hole-board"         # vertical, de pie sobre su canto, agujero apuntando en y
      spawn:
        x: [0.40, 0.42]          # delante de la mano derecha en home (>= 3.9 cm del robot); se
        y: [-0.07, -0.05]        # toma por el canto cercano y se acerca ~3 cm para la inserción
        z: 0.81                  # tapa de la mesa 0.72 + media tabla 0.09
        quat: [0, 0, 0, 1]
    - body: "peg"
      spawn:
        x: [0.34, 0.36]          # de pie (>= 3 cm del robot en home; más cerca del antebrazo
        y: [0.07, 0.09]          # izquierdo choca); desde x = 0.40 el IK pierde ~30° en el agarre
        z: 0.785                 # tapa de la mesa 0.72 + media altura 0.065
        quat: [0, 0, 0, 1]

- file: scene_icub_twoarmlift.xml
  label: "Two-Arm Lifting"
  task: "lift the object using both arms"
  objects:
    - body: "lift-pot"
      spawn:
        x: [0.35, 0.37]          # en x >= 0.38 el brazo izquierdo no alcanza a levantarla (IK)
        y: [-0.01, 0.01]
        z: 0.785                 # tapa de la mesa 0.72 + media altura 0.06 + 5 mm
        quat: [0, 0, 0, 1]       # 180 deg en z = identidad en el frame root (como Gazebo)
